name: Build ANG-Impianti

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract Version
      shell: pwsh
      run: |
        $version = Get-Content VERSION -Raw
        $version = $version.Trim()
        echo "PLUGIN_VERSION=$version" >> $env:GITHUB_ENV
        Write-Host "Plugin version: $version"

    - name: Patch PackageContents.xml con versione da VERSION
      shell: pwsh
      run: |
        # Source of truth = VERSION. Riscrive AppVersion= e Version= prima del bundle.
        $pc = Get-Content PackageContents.xml -Raw
        $pc = [regex]::Replace($pc, 'AppVersion="[^"]*"', "AppVersion=""$env:PLUGIN_VERSION""")
        $pc = [regex]::Replace($pc, '(?<!App)Version="[^"]*"', "Version=""$env:PLUGIN_VERSION""")
        Set-Content PackageContents.xml -Value $pc -NoNewline
        Write-Host "PackageContents.xml patched a v$env:PLUGIN_VERSION"
        Get-Content PackageContents.xml | Select-Object -First 10

    - name: Restore
      run: dotnet restore ImplantiAI.csproj

    - name: Build
      run: dotnet build ImplantiAI.csproj -c Release -o ./build

    - name: Crea Bundle
      shell: pwsh
      run: |
        New-Item -Force -ItemType Directory "ANGImpianti.bundle/Contents/2025"
        New-Item -Force -ItemType Directory "ANGImpianti.bundle/Contents/2026"
        Copy-Item "build/ImplantiAI.dll" "ANGImpianti.bundle/Contents/2025/"
        Copy-Item "build/ImplantiAI.dll" "ANGImpianti.bundle/Contents/2026/"
        Copy-Item "build/Newtonsoft.Json.dll" "ANGImpianti.bundle/Contents/2025/" -ErrorAction SilentlyContinue
        Copy-Item "build/Newtonsoft.Json.dll" "ANGImpianti.bundle/Contents/2026/" -ErrorAction SilentlyContinue
        Copy-Item "PackageContents.xml" "ANGImpianti.bundle/"
        Copy-Item "VERSION" "ANGImpianti.bundle/" -ErrorAction SilentlyContinue

    - name: Crea ZIP
      shell: pwsh
      run: |
        New-Item -Force -ItemType Directory "release"
        Compress-Archive -Path "ANGImpianti.bundle" -DestinationPath "release/ANGImpianti.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ANGImpianti-Bundle
        path: release/ANGImpianti.zip

    - name: Crea Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.PLUGIN_VERSION }}
        name: "ANG-Impianti AI v${{ env.PLUGIN_VERSION }}"
        body: "Aggiornamento automatico ANG-Impianti AI"
        files: release/ANGImpianti.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
