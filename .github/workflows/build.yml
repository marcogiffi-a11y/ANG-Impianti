name: Build ANG-Impianti

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore ImplantiAI.csproj

    - name: Build
      run: dotnet build ImplantiAI.csproj -c Release -o ./build

    - name: Crea Bundle
      shell: pwsh
      run: |
        New-Item -Force -ItemType Directory "ANGImpianti.bundle/Contents/2025"
        New-Item -Force -ItemType Directory "ANGImpianti.bundle/Contents/2026"
        Copy-Item "build/ImplantiAI.dll" "ANGImpianti.bundle/Contents/2025/"
        Copy-Item "build/ImplantiAI.dll" "ANGImpianti.bundle/Contents/2026/"
        Copy-Item "build/Newtonsoft.Json.dll" "ANGImpianti.bundle/Contents/2025/" -ErrorAction SilentlyContinue
        Copy-Item "build/Newtonsoft.Json.dll" "ANGImpianti.bundle/Contents/2026/" -ErrorAction SilentlyContinue
        Copy-Item "PackageContents.xml" "ANGImpianti.bundle/"
        Write-Host "Bundle creato!"

    - name: Installa Inno Setup
      run: choco install innosetup --yes --no-progress
      shell: pwsh

    - name: Crea Installer
      shell: pwsh
      run: |
        New-Item -Force -ItemType Directory "installer"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup.iss"
        Write-Host "Installer creato!"

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ANGImpianti-Setup
        path: installer/ANGImpianti_Setup.exe
        if-no-files-found: warn

    - name: Crea Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "ANG-Impianti AI v1.0.${{ github.run_number }}"
        body: |
          ## ANG-Impianti AI
          1. Scarica ANGImpianti_Setup.exe
          2. Chiudi AutoCAD
          3. Doppio click e installa
          4. Apri AutoCAD
        files: installer/ANGImpianti_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
